databaseChangeLog:
  - changeSet:
      id: 1
      author: Ahmed Bilal
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: patient
      changes:
        - createTable:
            tableName: patient
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: address
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: date_of_birth
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: registered_date
                  type: date
                  constraints:
                    nullable: false

