spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: patient-service-route
              uri: http://patient-service:5000
              predicates:
                - Path=/api/patients
              filters:
                - SetPath=/patients

            - id: api-docs-patient-route
              uri: http://patient-service:5000
              predicates:
                - Path=/api-docs/patients
              filters:
                - SetPath=/v3/api-docs